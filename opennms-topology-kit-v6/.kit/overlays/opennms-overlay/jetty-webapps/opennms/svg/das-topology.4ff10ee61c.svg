<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="0" height="0">
<!-- Generated by tools/build.mjs from src/. Do not edit. -->
<style><![CDATA[
/* Styles for /opennms/topology. The build puts this file inside das-topology.<hash>.svg;
   OpenNMS loads every SVG in jetty-webapps/opennms/svg into the topology page, so these
   rules apply to the whole page. Change the colours below; `npm run dev` shows them at once. */

:root {
  /* Tile behind each DAS icon: normal, mouse over, selected */
  --das-tile: #ffffff;
  --das-tile-border: #c3cbd6;
  --das-tile-hover: #fff6e5;
  --das-tile-hover-border: #f59e0b;
  --das-tile-selected: #e6f3fc;
  --das-tile-selected-border: #0b84c6;

  /* Links */
  --das-link: #8a97a8;            /* no status (GraphML views without a status script) */
  --das-link-up: #2e9e4f;         /* Enhanced Linkd: up; GraphML: normal */
  --das-link-warning: #e8a317;    /* GraphML: warning, minor */
  --das-link-down: #d93025;       /* Enhanced Linkd: down; GraphML: major, critical */
  --das-link-selected: #0b84c6;
  --das-link-hover: #f59e0b;
  --das-link-width: 3px;

  /* Node labels */
  --das-label: #1f2933;
  --das-label-size: 11px;
}

/* DAS icons (made from src/icons by tools/build.mjs) */
.das-tile { fill: var(--das-tile); stroke: var(--das-tile-border); stroke-width: 2px; }
.das-tile--hover { fill: var(--das-tile-hover); stroke: var(--das-tile-hover-border); stroke-width: 3px; }
.das-tile--selected { fill: var(--das-tile-selected); stroke: var(--das-tile-selected-border); stroke-width: 4px; }

/* Links: <path class="edge [selected] [status]">. OpenNMS sets an inline 3px width on
   Enhanced Linkd links, so the width needs !important. Later rules win over earlier ones. */
svg path.edge { stroke: var(--das-link); stroke-width: var(--das-link-width) !important; }
svg path.edge.up, svg path.edge.normal { stroke: var(--das-link-up); }
svg path.edge.warning, svg path.edge.minor { stroke: var(--das-link-warning); }
svg path.edge.down, svg path.edge.major, svg path.edge.critical { stroke: var(--das-link-down); }
svg path.edge.selected { stroke: var(--das-link-selected); }
svg path.edge:hover { stroke: var(--das-link-hover); }

/* Alarm frame behind every node icon (the colours stay OpenNMS's severity colours).
   Rounded to match the DAS tiles. */
svg .vertex > rect.status { rx: 8px; }

/* Node labels */
svg .vertex-label { fill: var(--das-label); font-size: var(--das-label-size); }
]]></style>
