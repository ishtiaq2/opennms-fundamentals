<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0"><!-- Made by topo.sh from styles/topology.css. -->
<style><![CDATA[
/* Your CSS for /opennms/topology.
   ./topo.sh deploys it inside jetty-webapps/opennms/svg/zz-topology-styles.<hash>.svg: OpenNMS loads
   every svg of that folder into the topology page, so these rules apply there, over the stock
   stylesheet (reference/topo_default-styles.css). Start rules with "svg" so they win.
   Examples 07-09 add rules here; FILES.md, section 6, lists the elements and classes. */


/* Change critical vertex background to magenta */
/* Change critical vertex background to magenta */
svg .vertex > rect.status.critical {
  stroke: #FF00FF !important;
  fill: #FF00FF !important;
}

/* Force ALL edges in ALL views to be 13px thick */
svg path.edge {
  stroke-width: 13px !important;
}

/* Change GraphML "normal" links AND standard "up" links to Cyan */
svg path.edge.normal,
svg path.edge.up {
  stroke: #00FFFF !important;
}
]]></style></svg>
