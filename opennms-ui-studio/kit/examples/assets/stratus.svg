<?xml version="1.0" encoding="UTF-8"?>
<!-- Placeholder Stratus icon (examples/06-new-icon.sh). OpenNMS needs these four groups; replace the
     shapes inside them with your artwork and keep the ids. OpenNMS measures the normal group
     ("stratus") and scales the icon so its longest side is 48 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g id="stratus_icon">
    <g id="stratus_active"><!-- selected node -->
      <rect width="100" height="100" fill="#FFFFFF"/>
      <circle cx="50" cy="50" r="45" fill="#09A8D3"/>
      <rect x="31" y="42" width="38" height="30" rx="4" fill="#FFFFFF"/>
      <path d="M38 42 L31 24 M62 42 L69 24" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="57" r="6" fill="#09A8D3"/>
    </g>
    <g id="stratus_rollover"><!-- mouse over the node -->
      <circle cx="50" cy="50" r="45" fill="#09A8D3"/>
      <rect x="31" y="42" width="38" height="30" rx="4" fill="#FFFFFF"/>
      <path d="M38 42 L31 24 M62 42 L69 24" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="57" r="6" fill="#09A8D3"/>
    </g>
    <g id="stratus"><!-- normal -->
      <rect width="100" height="100" fill="#FFFFFF"/>
      <circle cx="50" cy="50" r="45" fill="#505154"/>
      <rect x="31" y="42" width="38" height="30" rx="4" fill="#FFFFFF"/>
      <path d="M38 42 L31 24 M62 42 L69 24" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="57" r="6" fill="#505154"/>
    </g>
  </g>
</svg>
