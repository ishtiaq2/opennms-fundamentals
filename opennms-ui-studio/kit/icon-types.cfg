# Node type = icon id: the icon for each type of node (GUIDE-node-icons.md, part 4).
#
#   ./topo.sh view from-requisition <requisition>   a GraphML view of a requisition, each node with the icon of its type
#   ./dev.sh seed                                   the DAS demo of the development OpenNMS takes its icons from here too
#
# The type of a node is the first of its requisition categories that has a line here, else its asset field
# "category" or "modelNumber", else the word its node label starts with (nimbus-2: nimbus). The icon id must be an
# icon of the svg files (./topo.sh icons lists them); if no svg file has it, an icon named like the type is used
# (nimbus, das_nimbus), else the node gets the default icon. Upper and lower case do not matter on the left.
orion = orion
helix = helix
stratus = stratus
nimbus = nimbus
cirrus = cirrus
remote = remote
