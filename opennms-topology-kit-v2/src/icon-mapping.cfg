# Which nodes get which DAS icon, in OpenNMS's "<icon key> = <icon id>" format.
# deploy.sh merges these lines into etc/org.opennms.features.topology.app.icons.default.cfg;
# OpenNMS picks the change up within a second. Icon ids are das_<file name in src/icons>.
#
# Lines here go to every server. Lines that name node IDs belong in icon-mapping.<target>.cfg
# (icon-mapping.prod.cfg, icon-mapping.dev.cfg), because node IDs differ between servers.
#
# Enhanced Linkd views (All, Lldp, Cdp, UserDefined, ...) look up linkd.system.snmp.<sysObjectID>,
# then shorter prefixes of it. One line per model covers every Linkd view and future nodes:
# linkd.system.snmp.1.3.6.1.4.1.99999.1.1 = das_orion
#
# Single node, by view: <namespace>.<node id>. "All" is nodes, the other Linkd views are
# nodes:<View> (escape the colon). npm run map prints these lines from your nodes.
# nodes.12 = das_helix
# nodes\:UserDefined.12 = das_helix
#
# GraphML views need nothing here: set <data key="iconKey">das_orion</data> on the node.
